name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: npx -y skills@1.7.0 add . --list
      - name: Verify module discovery
        shell: bash
        run: |
          for module in skills/*; do
            npx -y skills@1.7.0 add "./$module" --list
          done
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - name: Install every module into Claude Code and Codex and diff against source
        run: scripts/verify-install.sh
      - name: Prove the published tag installs the same content
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG_URL: https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}
        run: scripts/verify-install.sh "$TAG_URL"

  required:
    name: Required CI
    if: always()
    needs: [catalog]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          CATALOG_RESULT: ${{ needs.catalog.result }}
        run: test "$CATALOG_RESULT" = success
