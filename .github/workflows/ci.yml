name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: npx -y skills@1.7.0 add . --list
      - name: Verify module discovery
        shell: bash
        run: |
          for module in skills/*; do
            npx -y skills@1.7.0 add "./$module" --list
          done
      - name: Smoke-test module installation across harnesses
        shell: bash
        run: |
          consumer="$(mktemp -d)"
          cd "$consumer"
          npx -y skills@1.7.0 add "$GITHUB_WORKSPACE/skills/delegation" \
            --skill '*' \
            -a claude-code \
            -a codex \
            -a gemini-cli \
            --copy -y
          test -f .agents/skills/delegating-to-claude-p/SKILL.md
          test -f .agents/skills/delegating-to-codex/SKILL.md
          test -f .agents/skills/writing-handoffs/SKILL.md
          test -f .claude/skills/delegating-to-codex/SKILL.md

  required:
    name: Required CI
    if: always()
    needs: [catalog]
    runs-on: ubuntu-latest
    steps:
      - name: Verify required jobs
        env:
          CATALOG_RESULT: ${{ needs.catalog.result }}
        run: test "$CATALOG_RESULT" = success
